name: Publish Sushi Native Toolchain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package to NuGet.org using the configured trusted publisher
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and validate pinned toolchain package
        shell: pwsh
        run: ./tools/NewLlvmMingwNuGetPackage.ps1 -PackageOutputDirectory artifacts/nuget
      - name: Upload validated NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: sushi-native-toolchain-nupkg
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: package
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download validated NuGet package
        uses: actions/download-artifact@v4
        with:
          name: sushi-native-toolchain-nupkg
          path: artifacts/nuget
      - name: Require configured NuGet profile
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "Set the repository Actions variable NUGET_USER and configure a matching NuGet.org Trusted Publishing policy before publishing."
          }
      - name: Exchange GitHub OIDC identity for a temporary NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Verify package is available through NuGet restore
        shell: pwsh
        run: |
          $manifest = Get-Content tools/llvm-mingw.json -Raw | ConvertFrom-Json
          $verifyRoot = Join-Path $env:RUNNER_TEMP "Sushi Toolchain NuGet Verification"
          New-Item -ItemType Directory -Path $verifyRoot -Force | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="$($manifest.packageId)" Version="$($manifest.packageVersion)" /></ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $verifyRoot "Verify.csproj")
          $restored = $false
          for ($attempt = 0; $attempt -lt 18 -and -not $restored; $attempt++) {
            dotnet restore (Join-Path $verifyRoot "Verify.csproj") --source https://api.nuget.org/v3/index.json --packages (Join-Path $verifyRoot "packages")
            if ($LASTEXITCODE -eq 0) {
              $restored = $true
            }
            else {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $restored) {
            throw "The package was published but could not be restored from NuGet.org after 3 minutes."
          }
