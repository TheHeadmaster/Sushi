name: Sushi
scopeName: source.sus
fileTypes:
  - sus
patterns:
  - include: "#comment"
  - include: "#using-statement"
  - include: "#namespace-declaration"
  - include: "#modifier"
  - include: "#class-declaration"
  - include: "#punctuation-semicolon"
repository:
  base-types:
    begin: \s*(extends|implements)\s+
    beginCaptures:
      1: { name: keyword.other.inheritance.sus }
    end: (?=\{|;|extends|implements)
    patterns:
    - include: "#comment"
    - include: "#preprocessor"
    - include: "#type"
    - include: "#punctuation-comma"
  class-declaration:
    begin: (?=\bclass\b)
    end: (?<=\})|(?=;)
    patterns:
    - include: "#comment"
    - include: "#preprocessor"
    - begin: \s*(class)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)
      beginCaptures:
        1 : { name: storage.type.class.sus }
        2 : { name: entity.name.type.class.sus }
      end: (?=\{)|(?=;)
      patterns:
        - include: "#comment"
        - include: "#type-parameter-list"
        - include: "#parenthesized-parameter-list"
        - include: "#base-types"
        - include: "#generic-constraints"
    - begin: \{
      beginCaptures:
        0: { name: punctuation.curlybrace.open.sus }
      end: \}
      endCaptures:
        0: { name: punctuation.curlybrace.close.sus }
      patterns:
      - include: "#members"
  comment:
    patterns:
      - name: comment.line.double-slash.sus
        begin: (^\s+)?(//).*$
        while: ^(\s*)(//).*$
        captures:
          "1":
            name: punctuation.whitespace.comment.leading.sus
          "2":
            name: punctuation.definition.comment.sus
      - name: comment.block.sus
        begin: /\*
        end: \*/
        captures:
          "0":
            name: punctuation.definition.comment.sus
  field-declaration:
    begin: (?<type_name>(?:(?:(?:(?<identifier>\@?[a-zA-Z][a-zA-Z0-9]*)\s*\:\:\s*)?(?<name_and_type_args>\g<identifier>\s*(?<type_args>\s*<(?:[^<>]|\g<type_args>)+>\s*)?)(?:\s*\.\s*\g<name_and_type_args>)*|(?<tuple>\s*\((?:[^\(\)]|\g<tuple>)+\)))(?:\s*\[(?:\s*,\s*)*\]\s*)*))\s+(\g<identifier>)\s*(?!=>|==)(?=,|;|=|$)
    beginCaptures:
      1:
        patterns:
        - include: "#type"
      2: { name: entity.name.variable.field.sus }
    end: (?=;)
    patterns:
    - include: "#comment"
    - include: "#punctuation-comma"
    - include: "#variable-initializer"
    - include: "#members"
  identifier:
    patterns:
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)(\.)
      captures:
        1: { name: entity.name.namespace.sus }
        2: { name: punctuation.accessor.sus }
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)
      captures:
        1: { name: entity.name.identifier.sus }
  members:
    patterns:
    - include: "#comment"
    - include: "#preprocessor"
    - include: "#modifier"
    - include: "#field-declaration"
  modifier:
    begin: \s*(public|private|const|static|protected|internal|readonly)\s+
    beginCaptures:
      1: { name: storage.modifier.sus }
    end: (?=;)|(?=\{)
    patterns:
    - include: "#comment"
    - include: "#modifier"
    - include: "#class-declaration"
  namespace-declaration:
    begin: \s*(namespace)\s+
    beginCaptures:
      1: { name: storage.type.namespace.sus }
    end: (;)
    endCaptures:
      1: { name: punctuation.semicolon.sus }
    patterns:
    - include: "#comment"
    - include: "#namespace-identifier"
  namespace-identifier:
    patterns:
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)(\.)
      captures:
        1: { name: entity.name.namespace.sus }
        2: { name: punctuation.accessor.sus }
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)
      captures:
        1: { name: entity.name.namespace.sus }
  punctuation-comma:
    name: punctuation.separator.comma.sus
    match: ','
  punctuation-semicolon:
    name: punctuation.separator.semicolon.sus
    match: ';'
  type:
    patterns:
    - include: "#comment"
    - include: "#type-builtin"
    - include: "#type-identifier"
    - include: "#type-arguments"
    - include: "#type-array-suffix"
  type-arguments:
    begin: \<
    beginCaptures:
      0: { name: punctuation.definition.typeparameters.begin.sus }
    end: \>
    endCaptures:
      0: { name: punctuation.definition.typeparameters.end.sus }
    patterns:
    - include: "#type"
    - include: "#punctuation-comma"
  type-array-suffix:
    begin: \[
    beginCaptures:
      0: { name: punctuation.squarebracket.open.sus }
    end: \]
    endCaptures:
      0: { name: punctuation.squarebracket.close.sus }
    patterns:
    - include: "#comment"
    - include: "#preprocessor"
    - include: "#punctuation-comma"
  type-builtin:
    match: \b(bool|u?int32|float32)\b
    captures:
      1: { name: keyword.type.builtin.cs }
  type-identifier:
    patterns:
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)(\.)
      captures:
        1: { name: entity.name.namespace.sus }
        2: { name: punctuation.accessor.sus }
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)
      captures:
        1: { name: entity.name.type.sus }
  type-parameter-list:
    begin: \<
    beginCaptures:
      0: { name: punctuation.definition.typeparameters.begin.sus }
    end: \>
    endCaptures:
      0: { name: punctuation.definition.typeparameters.end.sus }
    patterns:
      - match: (\@?[a-zA-Z][a-zA-Z0-9]*)\b
        name: entity.name.type.type-parameter.sus
      - include: "#comment"
      - include: "#punctuation-comma"
  using-statement:
    begin: \s*(using)\s+
    beginCaptures:
      1: { name: keyword.other.directive.using.sus }
    end: (;)
    endCaptures:
      1: { name: punctuation.semicolon.sus }
    patterns:
    - include: "#comment"
    - include: "#identifier"
