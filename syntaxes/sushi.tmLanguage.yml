name: Sushi
scopeName: source.sus
fileTypes:
  - sus

patterns:
  - include: '#comments'
  - include: '#integer-literals'
  - include: '#words'

repository:
  comments:
    patterns:
      - include: '#documentation-line-comment'
      - include: '#line-comment'
      - include: '#block-comment'
  
  documentation-line-comment:
    begin: '///'
    beginCaptures:
      "0":
        name: punctuation.definition.comment.sus
    end: '$'
    name: comment.line.documentation.sus
  line-comment:
    begin: '//'
    beginCaptures:
      "0":
        name: punctuation.definition.comment.sus
    end: '$'
    name: comment.line.double-slash.sus
  block-comment:
    begin: '/\*'
    beginCaptures:
      "0":
        name: punctuation.definition.comment.begin.sus
    end: '\*/'
    endCaptures:
      "0":
        name: punctuation.definition.comment.end.sus
    name: comment.block.sus
    patterns:
      - include: '#block-comment'
  words:
    patterns:
      - include: '#escaped-identifier'
      - include: '#boolean-literal'
      - include: '#control-keyword'
      - include: '#modifier-keyword'
      - include: '#type-builtin'
      - include: '#keyword'
      - include: '#identifier'
  escaped-identifier:
    match: '@(?:not|and|or|if|else|switch|case|default|noop|while|do|for|foreach|in|break|continue|return|propagate|panic|exit|namespace|package|using|alias|except|global|typeof|is|exactly|inherits|implements|extends|leaf|of|public|internal|protected|private|static|void|true|false|int8|uint8|int16|uint16|int32|uint32|int64|uint64|int128|uint128)(?![A-Za-z0-9_])'
    name: variable.other.readwrite.sus
  boolean-literal:
    patterns:
      - match: '(?<![A-Za-z0-9_])true(?![A-Za-z0-9_])'
        name: constant.language.boolean.true.sus
      - match: '(?<![A-Za-z0-9_])false(?![A-Za-z0-9_])'
        name: constant.language.boolean.false.sus
  keyword:
    patterns:
      - match: |-
          (?x)
          (?<![A-Za-z0-9_])
          (?:
            not|and|or|
            propagate|panic|
            namespace|package|using|alias|except|global|
            typeof|is|exactly|inherits|implements|extends|leaf|of|
            noop|void
          )
          (?![A-Za-z0-9_])
        name: keyword.other.sus
  identifier:
    match: '(?:[A-Za-z][A-Za-z0-9_]*|_+[A-Za-z0-9][A-Za-z0-9_]*)'
    name: variable.other.readwrite.sus
  control-keyword:
    patterns:
      - match: '(?<![A-Za-z0-9_])(?:if|else|switch|case|default)(?![A-Za-z0-9_])'
        name: keyword.control.conditional.sus
      - match: '(?<![A-Za-z0-9_])(?:while|do|for|foreach|in)(?![A-Za-z0-9_])'
        name: keyword.control.loop.sus
      - match: '(?<![A-Za-z0-9_])(?:break|continue|return|exit)(?![A-Za-z0-9_])'
        name: keyword.control.flow.sus
  modifier-keyword:
    match: '(?<![A-Za-z0-9_])(?:public|internal|protected|private|static)(?![A-Za-z0-9_])'
    name: storage.modifier.sus
  type-builtin:
    match: '(?<![A-Za-z0-9_])(?:int8|uint8|int16|uint16|int32|uint32|int64|uint64|int128|uint128)(?![A-Za-z0-9_])'
    name: keyword.type.builtin.sus
  integer-literals:
    patterns:
      - match: '(?<![A-Za-z0-9_])b#[0-9_]*'
        name: constant.numeric.integer.binary.sus
      - match: '(?<![A-Za-z0-9_])o#[0-9_]*'
        name: constant.numeric.integer.octal.sus
      - match: '(?<![A-Za-z0-9_])x#[0-9A-Fa-f_]*'
        name: constant.numeric.integer.hexadecimal.sus
      - match: '(?<![A-Za-z0-9_])[0-9](?:[0-9]|_(?=[0-9]))*'
        name: constant.numeric.integer.decimal.sus