name: Sushi
scopeName: source.sus
fileTypes:
  - sus
patterns:
  - include: "#comment"
  - include: "#using-statement"
  - include: "#namespace-declaration"
repository:
  comment:
    patterns:
      - name: comment.line.double-slash.sus
        begin: (^\s+)?(//).*$
        while: ^(\s*)(//).*$
        captures:
          "1":
            name: punctuation.whitespace.comment.leading.sus
          "2":
            name: punctuation.definition.comment.sus
      - name: comment.block.sus
        begin: /\*
        end: \*/
        captures:
          "0":
            name: punctuation.definition.comment.sus
  namespace-declaration:
    begin: \s*(namespace)\s+
    beginCaptures:
      1: { name: storage.type.namespace.sus }
    end: (;)
    endCaptures:
      1: { name: punctuation.semicolon.sus }
    patterns:
      - include: "#comment"
      - include: "#namespace-identifier"
  namespace-identifier:
    patterns:
      - match: (\@?[a-zA-Z][a-zA-Z0-9]*)(\.)
        captures:
          1: { name: entity.name.namespace.sus }
          2: { name: punctuation.accessor.sus }
      - match: (\@?[a-zA-Z][a-zA-Z0-9]*)
        captures:
          1: { name: entity.name.namespace.sus }
  using-statement:
    begin: \s*(using)\s+
    beginCaptures:
      1: { name: keyword.other.directive.using.sus }
    end: (;)
    endCaptures:
      1: { name: punctuation.semicolon.sus }
    patterns:
    - include: "#comment"
    - include: "#namespace-identifier"