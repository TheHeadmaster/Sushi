name: Sushi
scopeName: source.sus
fileTypes:
  - sus
patterns:
  - include: "#comment"
  - include: "#directives"
  - include: "#declarations"
repository:
  block:
    begin: \{
    beginCaptures:
      "0":
        name: punctuation.curlybrace.open.sus
    end: \}
    endCaptures:
      "0":
        name: punctuation.curlybrace.close.sus
    patterns:
      - include: "#statement"
  class-declaration:
    begin: (?=\bclass\b)
    end: (?<=\})
    patterns:
    - begin: \b(class)\b\s+(\@?[a-zA-Z][a-zA-Z0-9]*)\s*
      beginCaptures:
        1 : { name: storage.type.class.sus }
        2 : { name: entity.name.type.class.sus }
      end: (?=\{)
      patterns:
      - include: "#comment"
      - include: "#type-parameter-list"
      - include: "#base-types"
      - include: "#generic-constraints"
    - begin: \{
      beginCaptures:
        '0': { name: punctuation.curlybrace.open.sus }
      end: \}
      endCaptures:
        '0': { name: punctuation.curlybrace.close.sus }
      patterns:
      - include: "#class-members"
    - include: "#comment"
  class-members:
    patterns:
    - include: "#comment"
    - include: "#storage-modifier"
    - include: "#property-declaration"
    - include: "#creator-declaration"
    - include: "#destroyer-declaration"
    - include: "#method-declaration"
    - include: "#variable-initializer"
  comment:
    patterns:
      - name: comment.line.double-slash.sus
        begin: (^\s+)?(//).*$
        while: ^(\s*)(//).*$
        captures:
          "1":
            name: punctuation.whitespace.comment.leading.sus
          "2":
            name: punctuation.definition.comment.sus
      - name: comment.block.sus
        begin: /\*
        end: \*/
        captures:
          "0":
            name: punctuation.definition.comment.sus
  creator-declaration:
    begin: (creator)\s*(?=\()
    beginCaptures:
      1: { name: "keyword.other.creator.sus"}
    end: (?<=\})
    patterns:
    - include: "#comment"
    - include: "#parenthesized-parameter-list"
    - include: "#block"
  declarations:
    patterns:
    - include: "#comment"
    - include: "#storage-modifier"
    - include: "#namespace-declaration"
    - include: "#type-declarations"
  destroy-declaration:
    begin: (destroy)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)
    beginCaptures:
      1: { name: "keyword.other.destroy.sus" }
      2: { name: "entity.name.variable.property.sus" }
      3: { name: "entity.name.function.sus" }
    end: (?=;)
    patterns:
    - include: "#comment"
    - include: "#punctuation-semicolon"
  destroyer-declaration:
    begin: (destroyer)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)\s*(?=\()
    beginCaptures:
      1: { name: "keyword.other.destroyer.sus" }
      2: { name: "entity.name.function.sus" }
    end: (?<=\})
    patterns:
    - include: "#comment"
    - include: "#parenthesized-parameter-list"
    - include: "#block"
  directives:
    patterns:
    - include: "#using-directive"
  expression:
    patterns:
    - include: "#comment"
    - include: "#literal"
  literal:
    patterns:
    - include: "#numeric-literal"
  method-declaration:
    begin: (\@?[a-zA-Z][a-zA-Z0-9]*)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)\s*(?=\()
    beginCaptures:
      1:
        patterns:
        - include: "#type"
      2: { name: "entity.name.function.sus" }
    end: (?<=\})
    patterns:
    - include: "#comment"
    - include: "#parenthesized-parameter-list"
    - include: "#block"
  namespace-declaration:
    begin: \b(namespace)\s+
    beginCaptures:
      1: { name: storage.type.namespace.sus }
    end: (?=;)
    patterns:
    - include: "#comment"
    - name: entity.name.type.namespace.sus
      match: \@?[a-zA-Z][a-zA-Z0-9]*
    - include: "#punctuation-accessor"
  parameter:
    match: ([a-zA-Z][a-zA-Z0-9]*)\s+([a-z][a-zA-Z0-9]*)
    captures:
      1:
        patterns:
        - include: '#type'
      2: { name: entity.name.variable.parameter.sus }
  numeric-literal:
    match: (\d+)
    captures:
      1: { name: constant.numeric.decimal.sus }
  parenthesized-parameter-list:
    begin: (\()
    beginCaptures:
      '0': { name: punctuation.parenthesis.open.sus }
    end: (\))
    endCaptures:
      '0': { name: punctuation.parenthesis.close.sus }
    patterns:
    - include: '#comment'
    - include: '#parameter'
    - include: '#punctuation-comma'
  property-declaration:
    begin: (\@?[a-zA-Z][a-zA-Z0-9]*(?:\s*\[(?:\s*,\s*)*\])*)\s+(\@?[a-zA-Z][a-zA-Z0-9]*)\s*(?!=>|==)(?=;|=)
    beginCaptures:
      1:
        patterns:
        - include: "#type"
      2: { name: "entity.name.variable.property.sus" }
    end: (?=;)
    patterns:
    - include: "#comment"
    - include: "#variable-initializer"
  punctuation-accessor:
    name: punctuation.accessor.sus
    match: \.
  punctuation-comma:
    name: punctuation.separator.comma.sus
    match: ','
  punctuation-semicolon:
    name: punctuation.semicolon.sus
    match: ';'
  statement:
    patterns:
    - include: "#comment"
    - include: "#destroy-declaration"
  storage-modifier:
    name: storage.modifier.sus
    match: (?<!\.)\b(public|private|static|internal|const|readonly)\b
  type:
    patterns:
    - include: "#comment"
    - include: "#type-builtin"
    - include: "#type-name"
    - include: "#type-array-suffix"
  type-array-suffix:
    begin: \[
    beginCaptures:
      0: { name: punctuation.squarebacket.open.sus }
    end: \]
    endCaptures:
      0: { name: punctuation.squarebracket.close.sus }
    patterns:
    - include: "#comment"
    - include: "#punctuation-comma"
  type-builtin:
    match: \b(bool|int32|float32|uint32)\b
    captures:
      1: { name: keyword.type.builtin.sus }
  type-declarations:
    patterns:
    - include: "#comment"
    - include: "#class-declaration" 
  type-name:
    patterns:
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)\s*(\.)
      captures:
        1: { name: entity.name.type.sus }
        2: { name: punctuation.accessor.sus }
    - match: (\.)\s*(\@?[a-zA-Z][a-zA-Z0-9]*)
      captures:
        1: { name: punctuation.accessor.sus }
        2: { name: entity.name.type.sus }
    - name: entity.name.type.sus
      match: (\@?[a-zA-Z][a-zA-Z0-9]*)
  type-parameter-list:
    begin: \<
    beginCaptures:
      0: { name: punctuation.definition.typeparameters.begin.sus }
    end: \>
    endCaptures:
      0: { name: punctuation.definition.typeparameters.end.sus }
    patterns:
    - match: (\@?[a-zA-Z][a-zA-Z0-9]*)\b
      name: entity.name.type.type-parameter.sus
    - include: "#comment"
    - include: "#punctuation-comma"
  using-directive:
    patterns:
      - begin: \b(using)\b\s*+
        beginCaptures:
          1: { name: keyword.other.directive.using.sus }
        end: (?=;)
        patterns:
        - include: "#comment"
        - name: entity.name.type.namespace.sus
          match: \@?[a-zA-Z][a-zA-Z0-9]*
        - include: "#punctuation-accessor"
  variable-initializer:
    begin: (?<!=|!)(=)(?!=|>)
    beginCaptures:
      1: { name: keyword.operator.assignment.sus }
    end: (?=[,\)\];}])
    patterns:
    - include: "#expression" 